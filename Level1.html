<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agasthya &amp; Vibhavari Learning Corner</title>
<meta name="theme-color" content="#FBF6EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: home doorway → two worlds. Road/garage for the 5-year-old, craft table for the 11-year-old. Level chips + activity tabs + one stage. */
:root{
  color-scheme: light;
  --ink:#23232B; --muted:#5E5A66; --line:#E7DFD0;
  --road:#2E3138; --lane:#F6C431; --signal:#E8432E; --sky:#DCEFF7;
  --paper:#FBF6EC; --kraft:#E9D9BF; --felt:#E86A8E; --teal:#2A9D8F; --thread:#3B2F2A; --plum:#6D4C8D;
  --ok:#2F9E58; --okbg:#E3F5E9; --warn:#D9822B; --bad:#D9472B; --badbg:#FBE3DE;
  --display:"Baloo 2",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Home */
.hello{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.hello h1{font-size:clamp(28px,6vw,44px);font-weight:800}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.door{border:0;border-radius:22px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:210px;position:relative;overflow:hidden;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door h2{font-size:32px}
.door p{margin:0;max-width:32ch;font-weight:700}
.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.85}
.door.ag{background:var(--road);color:#fff}
.door.ag::after{content:"";position:absolute;left:0;right:0;bottom:30px;height:6px;background:repeating-linear-gradient(90deg,var(--lane) 0 34px,transparent 34px 60px)}
.door.ag .mini-car{position:absolute;right:18px;bottom:40px;width:96px;color:var(--signal)}
.door.vb{background:var(--kraft);color:var(--thread);outline:3px dashed rgba(59,47,42,.35);outline-offset:-12px}
.door.vb .mini-q{position:absolute;right:22px;bottom:22px;display:grid;grid-template-columns:repeat(3,22px);gap:4px}
.door.vb .mini-q i{width:22px;height:22px;border-radius:5px;display:block;border:1px dashed rgba(59,47,42,.35)}
.panel{background:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.panel h3{font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip.miss{background:#FDE7EC;border-color:#F4C3CF}
.small{font-size:13px;color:var(--muted);margin:0}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;max-width:68ch}
.linkbtn{border:0;background:none;color:var(--bad);font-weight:800;padding:0;text-decoration:underline;font-size:14px}

/* World shell */
.world{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:0;background:rgba(0,0,0,.08);border-radius:999px;padding:8px 14px;font-weight:800}
.top h2{font-size:26px;flex:1;min-width:0}
.levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.levels .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-right:4px}
.lv{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);border-radius:14px;padding:8px 13px;font-weight:800;font-size:15px;background:#fff}
.stage{border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-height:360px}
.prompt{font-family:var(--display);font-size:clamp(22px,4.5vw,30px);font-weight:700;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.opt{border:3px solid transparent;border-radius:18px;background:#fff;min-width:84px;padding:12px 18px;font-family:var(--display);font-size:26px;font-weight:700;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt.right,.sent.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong,.sent.wrong{border-color:var(--bad);background:var(--badbg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.say{border:0;border-radius:999px;padding:9px 16px;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.feedback{min-height:28px;font-weight:800;font-size:18px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)} .feedback.mid{color:var(--warn)}
.explain{background:#fff;border-radius:14px;padding:12px 16px;text-align:left;max-width:62ch;width:100%;border-left:5px solid var(--teal)}
.next{border:0;border-radius:14px;padding:12px 26px;font-weight:800;font-size:17px;color:#fff}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{border:2px solid currentColor;background:transparent;border-radius:14px;padding:10px 18px;font-weight:800}

/* Agasthya */
.ag-world .top h2{color:var(--road)}
.ag-world .tab{font-size:17px;padding:10px 18px}
.ag-world .tab.on,.ag-world .lv.on{background:var(--road);color:var(--lane);border-color:var(--road)}
.ag-world .stage{background:var(--sky)}
.ag-world .say{background:var(--lane);color:var(--road)}
.ag-world .next{background:var(--signal)}
.track{background:var(--road);border-radius:18px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;color:#fff}
.lane{position:relative;height:44px;background:repeating-linear-gradient(90deg,var(--lane) 0 22px,transparent 22px 40px) center/100% 4px no-repeat}
.lane .flag{position:absolute;right:0;top:4px;width:30px;height:36px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/12px 12px;border-radius:4px}
.lane .racer{position:absolute;top:2px;width:62px;color:var(--signal);transition:left .5s cubic-bezier(.3,1.4,.6,1)}
.track .meta{display:flex;justify-content:space-between;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.cars{display:grid;grid-template-columns:repeat(5,minmax(0,60px));gap:8px 10px;justify-content:center}
.cars span{display:block;position:relative}
.cars span.gone{opacity:.3}
.cars span.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-weight:800;font-size:26px}
.sum{font-family:var(--display);font-size:44px;font-weight:800;color:var(--road);font-variant-numeric:tabular-nums}
.groups{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.grp{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.grp .cars{grid-template-columns:repeat(5,minmax(0,44px))}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq span{background:#fff;border-radius:14px;min-width:64px;padding:8px 12px;font-family:var(--display);font-size:38px;font-weight:800;color:var(--road)}
.seq span.q{background:var(--lane)}
.big-letter{font-family:var(--display);font-size:clamp(84px,20vw,130px);line-height:1;font-weight:800;color:var(--road);background:#fff;border-radius:24px;padding:10px 34px}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,54px);color:var(--road)}
.brand b{color:var(--signal)}
.pic{font-size:84px;line-height:1}
.opt.emo{font-size:56px;padding:8px 18px}
.word{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:.06em;color:var(--road)}
.word .gap{display:inline-block;min-width:44px;border-bottom:5px solid var(--signal);color:var(--signal)}
.readme{font-family:var(--display);font-size:clamp(34px,8vw,52px);font-weight:800;color:var(--road);background:#fff;border-radius:18px;padding:8px 24px}

/* Vibhavari */
.vb-world .top h2{color:var(--thread)}
.vb-world .tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.vb-world .lv.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.vb-world .stage{background:var(--kraft);outline:3px dashed rgba(59,47,42,.3);outline-offset:-10px}
.vb-world .say{background:#fff;color:var(--thread)}
.vb-world .say.mic{background:var(--felt);color:#fff}
.vb-world .say.mic.live{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(217,71,43,.2)}}
.vb-world .next{background:var(--plum)}
.craft{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;background:#fff;border-radius:18px;padding:12px 16px;border:1px solid var(--line)}
.craft .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.bracelet{display:flex;gap:5px;flex-wrap:wrap;align-items:center;position:relative;padding:6px 2px}
.bracelet::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--thread);opacity:.35}
.bead{width:24px;height:24px;border-radius:50%;border:2px dashed #CDBFA8;background:var(--paper);position:relative}
.bead.on{border:0;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.quilt{display:grid;grid-template-columns:repeat(6,18px);gap:3px}
.quilt i{width:18px;height:18px;border-radius:3px;background:var(--paper);border:1px dashed #CDBFA8;display:block}
.streak{font-family:var(--display);font-size:28px;font-weight:800;color:var(--plum);line-height:1;font-variant-numeric:tabular-nums}
.topic{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--teal);background:#fff;border-radius:999px;padding:3px 12px}
.bigsent{font-family:var(--display);font-size:clamp(24px,5vw,34px);font-weight:700;color:var(--thread);max-width:30ch;line-height:1.25;text-wrap:balance}
.heard{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.words span{border-radius:8px;padding:2px 8px;font-weight:800;font-size:17px}
.words .hit{background:var(--okbg);color:#1E6B3B}
.words .miss{background:#FCEBD7;color:#8A4A0C}
.youSaid{font-size:14px;color:var(--muted);margin:0;max-width:60ch}
.meter{width:min(320px,100%);height:12px;background:#fff;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;transition:width .4s}
.meaning{font-size:18px;font-weight:700;max-width:46ch}
.string{min-height:62px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:rgba(255,255,255,.6);border-radius:16px;padding:8px 12px;width:100%;max-width:680px}
.tile{width:46px;height:46px;border-radius:50%;border:0;font-family:var(--display);font-size:23px;font-weight:800;color:#fff;box-shadow:inset -5px -5px 0 rgba(0,0,0,.15)}
.tile.used,.wcard.used{visibility:hidden}
.wcard{border:0;border-radius:12px;padding:8px 14px;background:#fff;font-weight:800;font-size:18px;box-shadow:0 2px 0 #CDBFA8}
.sent{border:3px solid transparent;border-radius:14px;background:#fff;padding:12px 16px;font-size:18px;font-weight:700;text-align:left;width:100%;max-width:580px}
.list{display:flex;flex-direction:column;gap:10px;width:100%;align-items:center}
.correct-word{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.04em}
.timer{font-family:var(--display);font-size:64px;font-weight:800;color:var(--plum);font-variant-numeric:tabular-nums;line-height:1}
.starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px}
.starters span{background:#fff;border-radius:10px;padding:6px 12px;font-weight:800;color:var(--plum)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;width:100%;max-width:620px;text-align:left}
.bub{max-width:85%;border-radius:18px;padding:10px 14px;font-weight:700;font-size:17px}
.bub small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;font-weight:800}
.bub.them{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.scenes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.scenes button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px}
.scenes button.on{border-color:var(--plum);color:var(--plum)}
/* story */
.story{background:#fff;border-radius:16px;padding:18px 20px;text-align:left;max-width:64ch;width:100%;display:flex;flex-direction:column;gap:10px;font-size:17px}
.story p{margin:0}
.story h3{font-size:26px}
/* phrase book */
.cat{width:100%;max-width:680px;background:#fff;border-radius:16px;text-align:left;overflow:hidden}
.cat>button{width:100%;border:0;background:none;padding:14px 16px;font-family:var(--display);font-size:20px;font-weight:700;text-align:left;display:flex;justify-content:space-between;gap:8px}
.cat ul{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.cat li{display:flex;flex-direction:column;gap:6px;background:var(--paper);border-radius:12px;padding:8px 12px}
.cat .pr{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cat .pr span{font-weight:700;font-size:17px;min-width:0}
.cat .pr .btnrow{gap:6px}
.cat .say{padding:6px 12px;font-size:14px}

.party{position:fixed;inset:0;display:grid;place-items:center;background:rgba(35,35,43,.55);z-index:20;padding:20px}
.party>div{background:#fff;border-radius:24px;padding:28px;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:12px}
.party h3{font-size:32px}
@media (max-width:520px){
  .stage{padding:18px 12px}
  .cars{grid-template-columns:repeat(5,minmax(0,50px))}
  .grp .cars{grid-template-columns:repeat(5,minmax(0,34px))}
  .tile{width:40px;height:40px;font-size:20px}
  .craft{grid-template-columns:1fr 1fr}
  .craft>div:first-child{grid-column:1/-1}
  .tab{font-size:14px;padding:7px 10px}
}
</style>
</head>

let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,rate=.9){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:'en-IN';u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const CONTR={"i'm":"i am","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","it's":"it is","let's":"let us","i'll":"i will","that's":"that is","what's":"what is","isn't":"is not","aren't":"are not","you're":"you are","we're":"we are","i've":"i have","wasn't":"was not","couldn't":"could not","there's":"there is","he's":"he is","she's":"she is","we'll":"we will","you'll":"you will"};
const NUMS={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','20':'twenty','80':'eighty','100':'one hundred'};
const FREE=new Set(['vibhavari','agasthya','riya','meera','rahul','priya','ananya','maam','dosa','payasam','diwali','bangalore']);
function norm(t){
  t=t.toLowerCase().replace(/[’‘]/g,"'").replace(/ma'am|madam|mam\b/g,'maam');
  t=t.replace(/[^a-z0-9' ]+/g,' ');
  return t.split(/\s+/).filter(Boolean).flatMap(w=>{w=w.replace(/^'+|'+$/g,'');if(CONTR[w])return CONTR[w].split(' ');if(NUMS[w])return NUMS[w].split(' ');return [w.replace(/'s$/,'').replace(/'/g,'')]}).filter(Boolean);
}
function scoreSpeech(target,heard){
  const T=norm(target),H=norm(heard),pool=[...H];
  const marks=T.map(w=>{if(FREE.has(w))return true;const i=pool.indexOf(w);if(i>=0){pool.splice(i,1);return true}return false});
  return{score:marks.filter(Boolean).length/Math.max(1,T.length),marks};
}
/* A reusable practise block: Listen / Slow / Say it, with a word-by-word result. onPass called once when score >= .7 */
function micBlock(text,onPass){
  const el=document.createElement('div');el.className='heard';
  el.innerHTML=`<div class="btnrow"><button class="say" data-a="n">🔊 Listen</button><button class="say" data-a="s">🐢 Slow</button><button class="say mic" data-a="m">🎤 Say it</button></div><div class="res heard"></div>`;
  const res=$('.res',el);let passed=false,rec=null;
  const pass=()=>{if(!passed){passed=true;onPass&&onPass()}};
  $('[data-a=n]',el).onclick=()=>speak(text);
  $('[data-a=s]',el).onclick=()=>speak(text,.6);
  const mic=$('[data-a=m]',el);
  mic.onclick=()=>{
    if(!SR){res.innerHTML=`<p class="hint">This browser cannot listen. Read the sentence aloud clearly, then tap below.</p><button class="next" style="background:var(--teal)">I said it aloud</button>`;
      $('button',res).onclick=()=>{res.innerHTML='<div class="feedback ok">Well done! Say it once more, a little faster.</div>';pass()};return}
    if(rec){try{rec.stop()}catch(e){}return}
    try{speechSynthesis.cancel()}catch(e){}
    rec=new SR();rec.lang='en-IN';rec.interimResults=false;rec.maxAlternatives=4;
    mic.classList.add('live');mic.textContent='● Listening… tap to stop';res.innerHTML='<p class="hint">Speak now, clearly and not too fast.</p>';
    let got=false;
    rec.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);let best={score:-1};
      alts.forEach(a=>{const s=scoreSpeech(text,a);if(s.score>best.score)best={...s,said:a}});
      const p=Math.round(best.score*100),words=text.split(/\s+/);
      const cls=p>=85?'ok':p>=60?'mid':'no',msg=p>=85?'Excellent! Clear and correct.':p>=60?'Good! Practise the orange words and try again.':'Try again. Listen once, then say it slowly.';
      res.innerHTML=`<div class="meter"><i style="width:${p}%;background:var(--${cls==='ok'?'ok':cls==='mid'?'warn':'bad'})"></i></div><div class="feedback ${cls}">${p}% · ${msg}</div>
        <div class="words">${words.map((w,i)=>`<span class="${best.marks[i]?'hit':'miss'}">${esc(w)}</span>`).join('')}</div><p class="youSaid">I heard: “${esc(best.said)}”</p>`;
      if(best.score>=.7)pass();};
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')res.innerHTML='<p class="hint">The microphone is blocked. Allow microphone for this site in your browser settings, then try again.</p>';
      else if(e.error==='no-speech')res.innerHTML='<p class="hint">I did not hear anything. Tap Say it and speak a little louder.</p>';};
    rec.onend=()=>{rec=null;mic.classList.remove('live');mic.textContent='🎤 Say it';if(!got&&res.innerHTML.includes('Speak now'))res.innerHTML='<p class="hint">I did not hear anything. Tap Say it and try again.</p>'};
    try{rec.start()}catch(e){rec=null;mic.classList.remove('live');mic.textContent='🎤 Say it'}
  };
  return el;
}

  const list=SPELL[LV()];let item=null;
  const missed=S.vb.missed.map(w=>list.find(x=>x[0]===w)).filter(Boolean);
  item=missed.length&&Math.random()<.4?pick(missed):fromQueue('spell'+LV(),list);
  const [word,mean,parts]=item;
  const letters=shuffle(word.toLowerCase().split('').map(c=>({c})));let built=[];
  st.innerHTML=`<div class="prompt">Spell the word</div><p class="meaning">Meaning: ${esc(mean)}</p><button class="say" id="say">🔊 Hear the word</button>
    <div class="string" id="str"></div><div class="opts" id="beads">${letters.map((l,k)=>`<button class="tile" data-k="${k}" style="background:${FELT[k%8]}">${l.c}</button>`).join('')}</div>
    <div class="btnrow" id="ctl"><button class="ghost" id="clr">Clear</button><button class="next" id="chk">Check</button></div><div class="feedback" id="fb"></div><div id="after"></div>`;
  const s=()=>speak(word);s();$('#say').onclick=s;
  const draw=()=>{const str=$('#str');str.innerHTML=built.length?built.map((k,i)=>`<button class="tile" data-i="${i}" style="background:${FELT[k%8]}">${letters[k].c}</button>`).join(''):'<span class="hint">Tap the beads in order</span>';
    $$('#beads .tile',st).forEach(b=>b.classList.toggle('used',built.includes(+b.dataset.k)));
    $$('.tile',str).forEach(b=>b.onclick=()=>{built.splice(+b.dataset.i,1);draw()})};
  draw();
  $$('#beads .tile',st).forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!built.includes(k)){built.push(k);draw()}});
  $('#clr').onclick=()=>{built=[];draw()};
  $('#chk').onclick=()=>{
    const ans=built.map(k=>letters[k].c).join('');if(ans.length<word.length){fb(false,'Use all the beads first.');return}
    $('#ctl').hidden=true;const ok=ans===word.toLowerCase();
    if(ok){fb(true,'Perfect spelling!');speak('Perfect! '+word);S.vb.missed=S.vb.missed.filter(w=>w!==word);vbWin()}
    else{fb(false,'Almost! Here is the right spelling:');speak(`The correct spelling is ${word.split('').join(' ')}`);if(!S.vb.missed.includes(word))S.vb.missed.push(word);S.vb.missed=S.vb.missed.slice(-25);save()}
    $('#after').innerHTML=`<div class="correct-word">${esc(word)}</div><p class="hint">Break it into parts: <b style="color:var(--plum)">${esc(parts)}</b>. Write it 3 times in your notebook.</p>`;nextBtn();
  };
}

/* --- Phrase book --- */
let openCat=0;
function vbPhrases(st){
  st.innerHTML=`<div class="prompt">Useful phrases</div><p class="hint">Learn these by heart. Tap Practise to say one aloud.</p><div class="list" id="cats"></div>`;
  const cats=$('#cats');
  PHRASES.forEach(([title,items],ci)=>{
    const c=document.createElement('div');c.className='cat';
    c.innerHTML=`<button>${esc(title)}<span>${ci===openCat?'−':'+'}</span></button><ul ${ci===openCat?'':'hidden'}>${items.map((p,i)=>`<li data-i="${i}"><div class="pr"><span>${esc(p)}</span><div class="btnrow"><button class="say" data-a="h">🔊</button><button class="say mic" data-a="p">Practise</button></div></div></li>`).join('')}</ul>`;
    $('button',c).onclick=()=>{openCat=openCat===ci?-1:ci;vbPhrases(st)};
    $$('li',c).forEach(li=>{const p=items[+li.dataset.i];$('[data-a=h]',li).onclick=()=>speak(p);
      $('[data-a=p]',li).onclick=e=>{e.target.closest('.btnrow').hidden=true;li.appendChild(micBlock(p.replace(/…/g,''),()=>{S.vb.spoken++;vbWin()}))}});
    cats.appendChild(c);
  });
}

/* --- 1-minute talk --- */
function vbMinute(st){
  const [p,starters]=fromQueue('talk'+LV(),TALKS[LV()]),secs=[60,90,120][LV()-1];let left=secs;clearInterval(tick);
  const fmt=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;
  st.innerHTML=`<div class="prompt">Speak in English for ${['1 minute','1½ minutes','2 minutes'][LV()-1]}</div><p class="meaning">${esc(p)}</p>
    <p class="hint">Use these sentence starters:</p><div class="starters">${starters.map(s=>`<span>${esc(s)}</span>`).join('')}</div>
    <p class="hint">Talk to Amma or Appa. Use full sentences. Mistakes are fine. Keep talking!</p>
    <div class="timer" id="tm">${fmt(secs)}</div>
    <div class="btnrow" id="ctl"><button class="next" id="start">Start timer</button><button class="ghost" id="other">Another topic</button></div><div class="feedback" id="fb"></div>`;
  speak(p);$('#other').onclick=vbNext;
  $('#start').onclick=()=>{$('#start').disabled=true;tick=setInterval(()=>{left--;const t=$('#tm');if(!t){clearInterval(tick);return}t.textContent=fmt(left);
    if(left<=0){clearInterval(tick);t.textContent='Done!';fb(true,'Great talking! Parent: tap below if she spoke well.');
      nextBtn('She spoke well · add 3 beads',()=>{vbWin(3);vbNext()})}},1000)};
}

function vbNext(noScroll){
  const st=$('#stage');if(!st)return;clearInterval(tick);try{speechSynthesis.cancel()}catch(e){}
  ({speak:vbSpeak,talk:vbTalk,story:vbStory,words:vbWords,build:vbBuild,fix:vbFix,spell:vbSpell,phrases:vbPhrases,minute:vbMinute})[vbTab](st);
  if(noScroll!==true)window.scrollTo({top:Math.max(0,st.offsetTop-80),behavior:'smooth'});
}

home();
